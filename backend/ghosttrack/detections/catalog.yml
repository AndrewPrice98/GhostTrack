# GhostTrack detection catalog. Single source of truth for thresholds: the detection code reads
# every number below from this file (tests check that it does).
#
# All detections are plausibility checks on decoded, aggregated ADS-B data (adsb.lol). None of
# them proves spoofing on its own. A detection whose inputs are missing reports "not evaluated";
# it never reports "clean" for something it could not check.
#
# Units: kt (knots), ft, ft/min, NM, s, g (9.80665 m/s^2).
version: 1

# Shared timing rules (see ghosttrack/tracker.py): positions older than stale_position_s are
# never used for kinematics; a gap longer than segment_gap_s starts a new track segment.
common:
  stale_position_s: 60
  segment_gap_s: 300
  # Merge violations of the same detection that are closer than this into one finding.
  merge_window_s: 60
  # MLAT and TIS-B positions/velocities are derived by ground systems (multilateration, radar
  # fusion), not reported by the aircraft's own GNSS. Their error is much larger than ADS-B
  # (hundreds of metres to over 1 km for MLAT; TIS-B radar tracks are coarse and lag). Kinematic
  # thresholds are multiplied by this factor and confidences scaled down for these sources.
  derived_source_factor: 1.5
  derived_source_confidence: 0.6
  derived_sources: [mlat, tisb]

# Position error allowance per point used by GT-004/GT-005, subtracted from jump distances.
# ADS-B: from NACp (DO-260B estimated position uncertainty bounds, rounded up): NACp 11 < 3 m,
# 10 < 10 m, 9 < 30 m, 8 < 93 m, 7 < 0.1 NM, 6 < 0.3 NM, 5 < 0.5 NM, 4 < 1 NM, 3 < 2 NM, 2 < 4 NM,
# 1 < 10 NM, 0 unknown. Large values are capped at max_nm: a position that bad gives no useful
# jump evidence, and capping keeps one bad point from hiding a 20 NM teleport.
position_error_nm:
  adsb_by_nac_p: {11: 0.01, 10: 0.01, 9: 0.02, 8: 0.05, 7: 0.1, 6: 0.3, 5: 0.5, 4: 1.0, 3: 2.0, 2: 2.0, 1: 2.0, 0: 2.0}
  adsb_unknown: 1.0
  mlat: 1.0
  tisb: 1.0
  other: 1.0
  max_nm: 2.0

# Kinematic limits per ADS-B emitter category (DECISIONS.md section 4). Values are deliberately
# generous ceilings, not typical performance: ground speed includes up to ~200 kt of jet-stream
# tailwind; categories are self-declared and sometimes wrong (a light jet transmitting A1).
#   max_gs_kt      ground speed ceiling
#   max_vrate_fpm  |vertical rate| ceiling
#   max_load_g     load factor used for the turn check (lateral accel <= g*sqrt(n^2-1)); null = no turn check
#   max_accel_g    |along-track acceleration| ceiling (from consecutive ground speeds)
# A category of null means "not evaluated" for that quantity.
categories:
  A1:
    label: Light (< 15,500 lb)
    max_gs_kt: 600
    max_vrate_fpm: 10000
    max_load_g: 6.0
    max_accel_g: 1.0
    rationale: >-
      Fast light types (turboprop singles, very light jets) cruise at 300-410 KTAS; plus a
      200 kt tailwind and margin for light jets that mis-declare A1. Climb rates of light types
      are < 4,000 fpm; 10,000 fpm allows steep descents. 6 g covers aerobatic-category aircraft.
  A2:
    label: Small (15,500-75,000 lb)
    max_gs_kt: 750
    max_vrate_fpm: 15000
    max_load_g: 3.0
    max_accel_g: 1.0
    rationale: >-
      Business jets reach Mach 0.93 (about 530 KTAS at altitude); plus 200 kt tailwind.
      Emergency descents of business jets can exceed 6,000 fpm; 15,000 is a ceiling. Transport
      and business jets are certified to a 2.5 g limit load; 3.0 adds margin.
  A3:
    label: Large (75,000-300,000 lb)
    max_gs_kt: 800
    max_vrate_fpm: 15000
    max_load_g: 3.0
    max_accel_g: 1.0
    rationale: >-
      Airliners cruise at Mach 0.78-0.86 (450-500 KTAS); the highest reported ground speeds of
      airliners in strong jet streams are around 700-720 kt. Transport category limit load is
      2.5 g. Emergency descents are typically 4,000-8,000 fpm.
  A4:
    label: High vortex (B757)
    max_gs_kt: 800
    max_vrate_fpm: 15000
    max_load_g: 3.0
    max_accel_g: 1.0
    rationale: Same airframe class as A3.
  A5:
    label: Heavy (> 300,000 lb)
    max_gs_kt: 800
    max_vrate_fpm: 15000
    max_load_g: 3.0
    max_accel_g: 1.0
    rationale: Same reasoning as A3 (widebodies cruise at Mach 0.84-0.86).
  A6:
    label: High performance (> 5 g and > 400 kt)
    max_gs_kt: 1500
    max_vrate_fpm: 30000
    max_load_g: 9.0
    max_accel_g: 3.0
    rationale: >-
      Fighter-class performance by definition; supersonic flight possible. Ceilings are loose
      and the category is rare in civil traffic.
  A7:
    label: Rotorcraft
    max_gs_kt: 300
    max_vrate_fpm: 6000
    max_load_g: null
    max_accel_g: 1.0
    rationale: >-
      Conventional helicopters cruise below 170 KTAS; tiltrotors near 275 KTAS. Helicopters can
      hover and pivot, so ground track is meaningless at low speed: no turn-rate check.
  B1:
    label: Glider / sailplane
    max_gs_kt: 300
    max_vrate_fpm: 4000
    max_load_g: 6.0
    max_accel_g: 1.0
    rationale: VNE of high-performance gliders is about 150-160 kt; plus wind.
  B2:
    label: Lighter than air
    max_gs_kt: 250
    max_vrate_fpm: 6000
    max_load_g: null
    max_accel_g: 0.5
    rationale: >-
      Balloons drift with the wind (stratospheric winds rarely above 200 kt). Balloon track is
      wind-driven, so no turn check.
  B3:
    label: Parachutist / skydiver
    max_gs_kt: 250
    max_vrate_fpm: 25000
    max_load_g: null
    max_accel_g: 2.0
    rationale: Head-down freefall exceeds 15,000 fpm; horizontal speed is mostly wind.
  B4:
    label: Ultralight / hang-glider / paraglider
    max_gs_kt: 250
    max_vrate_fpm: 4000
    max_load_g: 6.0
    max_accel_g: 1.0
    rationale: Ultralights fly below about 100 kt; plus wind.
  B6:
    label: Unmanned aerial vehicle
    max_gs_kt: 600
    max_vrate_fpm: 15000
    max_load_g: 6.0
    max_accel_g: 2.0
    rationale: Large UAVs cruise up to about 340 KTAS; small ones are far slower.
  B7:
    label: Space / transatmospheric vehicle
    max_gs_kt: null
    max_vrate_fpm: null
    max_load_g: null
    max_accel_g: null
    rationale: No meaningful ceiling; kinematic checks are not evaluated.
  unknown:
    label: Unknown (A0, B0, B5, D*, missing)
    max_gs_kt: 1000
    max_vrate_fpm: 20000
    max_load_g: 9.0
    max_accel_g: 3.0
    rationale: >-
      No category declared (common: about 15 % of records in the committed recordings). Use
      ceilings above any civil transport (ground speed records near 720 kt) but below supersonic
      flight, which is prohibited for civil aircraft over the US (14 CFR 91.817).

detections:
  - id: GT-001
    title: Impossible ground speed for the emitter category
    severity: medium
    scope: track
    rationale: >-
      A ghost track is often generated with a speed that no aircraft of the declared category can
      reach. Ground speed (gs) is compared with the category ceiling.
    inputs: [gs_kt, category, on_ground, seen_pos_s, source]
    thresholds:
      gs_ceiling: categories.<cat>.max_gs_kt (x derived_source_factor for MLAT/TIS-B)
      min_samples: 2
    false_positive_notes: >-
      Ceilings are generous and need two samples above the ceiling within one segment. Airborne
      only: on-ground aircraft and C-category vehicles are excluded; stale positions are skipped.
    benign_causes:
      - Wrong emitter category in the transponder configuration (for example a jet set to A1).
      - Ground speed derived by MLAT/TIS-B rather than reported by the aircraft.
      - Exceptional jet-stream tailwind.
    references:
      - DECISIONS.md section 4 (emitter categories)
      - readsb README-json.md (gs in knots)

  - id: GT-002
    title: Impossible vertical rate
    severity: medium
    scope: track
    rationale: >-
      Reported vertical rate (baro_rate, else geom_rate) and the rate implied by consecutive
      barometric altitudes are compared with the category ceiling.
    inputs: [baro_rate_fpm, geom_rate_fpm, alt_baro_ft, category, on_ground, seen_pos_s]
    thresholds:
      vrate_ceiling: categories.<cat>.max_vrate_fpm (x derived_source_factor for MLAT/TIS-B)
      min_samples: 2
      min_dt_s: 4
      alt_quantum_ft: 25
    false_positive_notes: >-
      Implied rates use position times (snapshot time minus seen_pos), at least 4 s apart, with an
      allowance of two altitude quanta (25 ft each). Two violations per segment are required, so
      a single corrupt altitude reply does not alert.
    benign_causes:
      - Single corrupted altitude reply (Gillham/Mode C decoding errors on older equipment).
      - Altimeter or air-data fault on the aircraft.
      - Steep emergency descent close to the ceiling.
    references:
      - readsb README-json.md (baro_rate, geom_rate in ft/min)

  - id: GT-003
    title: Impossible turn rate or acceleration
    severity: low
    scope: track
    rationale: >-
      Lateral acceleration in a turn is turn rate x speed and is bounded by the load factor:
      a_lat <= g*sqrt(n^2 - 1). Along-track acceleration is bounded by engine thrust and drag.
      Both are computed from consecutive reported ground speed and track.
    inputs: [gs_kt, track_deg, category, on_ground, seen_pos_s, source]
    thresholds:
      lateral_limit: g*sqrt(max_load_g^2 - 1) x tolerance
      accel_limit: max_accel_g x tolerance
      tolerance: 1.5
      min_gs_kt_for_turn: 80
      min_dt_s: 2
      max_dt_s: 30
      takeoff_exclusion_s: 60
      min_samples: 2
    false_positive_notes: >-
      Ground speed is not airspeed: turning through a strong wind changes ground speed, hence the
      1.5 tolerance. Track is noisy at low speed, so turns are only checked above 80 kt, and not
      for rotorcraft or balloons. Pairs further apart than 30 s are skipped (heading changes can
      alias). Accelerations within 60 s after an on-ground report are skipped: the air/ground
      switch and gs source change at take-off produce steps.
    benign_causes:
      - Velocity derived by MLAT/TIS-B, or a ground speed step when the velocity source changes.
      - Heading/track aliasing when updates are sparse.
    references:
      - 14 CFR 25.337 (transport category limit load 2.5 g); 14 CFR 23.2200 / CS-23 load factors

  - id: GT-004
    title: Position jump (teleport)
    severity: high
    scope: track
    rationale: >-
      Implied speed between consecutive fresh positions in one segment (great-circle distance
      minus position error allowances, over the position-time difference) above the category
      ceiling plus tolerance.
    inputs: [lat, lon, seen_pos_s, nac_p, source, category, on_ground]
    thresholds:
      speed_ceiling: categories.<cat>.max_gs_kt x tolerance (x derived_source_factor for MLAT/TIS-B)
      tolerance: 1.2
      min_jump_nm: 0.5
      min_dt_s: 1.0
    false_positive_notes: >-
      Uses position times, not snapshot times, so repeated or late positions do not create fake
      jumps. Gaps longer than 5 minutes start a new segment and are never a teleport. Repeated
      positions are skipped. Ground traffic is excluded.
    benign_causes:
      - MLAT solution jumping between geometries (mitigated by the 1 NM MLAT allowance).
      - A bad GNSS/INS position from the aircraft (often with a low NACp).
      - Two aircraft briefly using the same address (see GT-005).
    references:
      - Review Focus 3 (haversine, 5-minute segments)

  - id: GT-005
    title: Duplicate ICAO address
    severity: high
    scope: track
    rationale: >-
      The same 24-bit address reported at two places at (nearly) the same time, faster than
      Mach 3 apart: either two reports in one snapshot, or a track that jumps out and back
      (A -> B -> A) with both jumps faster than Mach 3 while A -> A is plausible.
    inputs: [lat, lon, seen_pos_s, nac_p, source]
    thresholds:
      mach3_kt: 1984
      min_separation_nm: 5.0
      min_dt_s: 1.0
    false_positive_notes: >-
      Upstream aggregators merge reports per address, so a real duplicate shows up as an
      interleaved, alternating track. A single jump that stays offset is GT-004, not GT-005.
    benign_causes:
      - Two aircraft with the same address through a transponder configuration error (addresses are set by hand at installation).
      - A test bench or ground transponder using a real address.
    references:
      - ICAO Annex 10 Vol III Part I Ch. 9 (each aircraft has a unique address)

  - id: GT-006
    title: ICAO address allocation mismatch
    severity: medium
    scope: track
    rationale: >-
      The address's State (ICAO Annex 10 Table 9-1 block) differs from the State of the
      registration's nationality mark, or a US N-number does not convert to the address.
    inputs: [icao, registration]
    thresholds:
      rule: flag only if both States are known and disagree, or a valid N-number converts to a different address
    false_positive_notes: >-
      Conservative: unknown prefixes, addresses outside every Table 9-1 block (for example
      Taiwan) and ICAO temporary blocks are "not evaluated". Note that adsb.lol's registration
      ("r") comes from its own database keyed by the address, not from the aircraft, so on live
      data this mostly finds database or re-registration inconsistencies; it matters most for
      injected or uploaded data.
    benign_causes:
      - Aircraft transferred to a new State of registry before its transponder address was reprogrammed.
      - US aircraft re-registered with a new N-number but still transmitting the old Mode S code.
      - Error in the registration database used by the data source.
    references:
      - ICAO Annex 10 Vol III Part I, Appendix to Ch. 9, Table 9-1 (ghosttrack/facts/icao_table9_1.py)
      - ICAO Annex 7 (nationality marks; ghosttrack/facts/registration_prefixes.py)
      - DECISIONS.md section 3 (N-number mapping, own derivation)

  - id: GT-007
    title: Barometric / geometric altitude divergence
    severity: medium
    scope: track
    rationale: >-
      alt_baro is pressure altitude (1013.25 hPa datum); alt_geom is GNSS height above the WGS84
      ellipsoid. They differ by the pressure offset (QNH), the temperature error (non-ISA air)
      and the geoid height, but within a bounded band. A spoofed GNSS position or a fabricated
      track often gets one of them wrong.
    inputs: [alt_baro_ft, alt_geom_ft, on_ground, seen_pos_s]
    thresholds:
      pressure_band_ft: 1500
      temperature_fraction: 0.12
      geoid_ft: 350
      tolerance: pressure_band_ft + temperature_fraction x |alt_baro| + geoid_ft
      min_samples: 3
      min_duration_s: 15
    false_positive_notes: >-
      Pressure band: QNH 958-1068 hPa at about 27 ft/hPa. Temperature: altimeter error is about
      4 % of height per 10 C of ISA deviation; 0.12 covers +-30 C. Geoid: EGM96 undulation is
      within about -106 m to +85 m (350 ft). Needs 3 samples over 15 s: GNSS height is briefly
      wrong while a receiver acquires (seen in the recordings with NIC 1).
    benign_causes:
      - Extreme pressure systems (tropical cyclones) or extreme temperatures.
      - GNSS receiver acquiring or degraded (low NIC), or a faulty altitude source.
      - Altitude reported in 100 ft steps by older transponders near the band edge.
    references:
      - readsb README-json.md (alt_geom is WGS84 height)
      - ICAO Doc 8168 Vol I (altimeter temperature error, about 4 % per 10 C)

  - id: GT-008
    title: Emergency squawk without matching behaviour
    severity: info
    scope: track
    rationale: >-
      7500 (unlawful interference), 7600 (radio failure) and 7700 (emergency) usually go with a
      change of behaviour: descent, diversion, speed change. A sustained emergency code on a
      track that keeps a perfectly steady profile, or on a ground vehicle, is unusual and worth a
      look. Low confidence and informational only: many real emergencies (medical, minor
      technical) involve no visible change for a long time.
    inputs: [squawk, alt_baro_ft, track_deg, gs_kt, category]
    thresholds:
      codes: ['7500', '7600', '7700']
      min_duration_s: 120
      steady_alt_ft: 1000
      steady_track_deg: 30
      steady_gs_kt: 50
      confidence: 0.2
    false_positive_notes: >-
      Codes seen for less than 2 minutes are not evaluated (transient codes while a pilot dials a
      new squawk). Never raised above "info".
    benign_causes:
      - Medical or minor technical emergency with no change of flight profile yet.
      - Radio failure (7600) flown exactly as cleared, as the rules require.
      - Squawk briefly passing through an emergency code when changing codes.
    references:
      - ICAO Doc 4444 / FAA AIM 6-2-2 (emergency transponder codes)

  - id: GT-009
    title: Ghost flood
    severity: high
    scope: fleet
    rationale: >-
      Spoofing tools can inject many fabricated aircraft at once. Real aircraft seldom appear
      together in a small area with the same velocity. Flags when at least min_new new airborne
      addresses appear within window_s and radius_nm of each other with ground speeds within
      gs_spread_kt and tracks within track_spread_deg.
    inputs: [lat, lon, gs_kt, track_deg, first appearance time]
    thresholds:
      min_new: 5
      window_s: 60
      radius_nm: 10
      gs_spread_kt: 15
      track_spread_deg: 10
      warmup_s: 60
    false_positive_notes: >-
      Addresses already present in the first warmup_s of an observation are not "new". Ground
      traffic and appearances without speed or track are not evaluated. Formation flights and
      airshows can match; five or more is rare outside them.
    benign_causes:
      - Formation flight or airshow.
      - Several aircraft entering receiver coverage together (rare at the same speed and track).
    references:
      - Costin and Francillon, "Ghost in the Air(Traffic)", Black Hat USA 2012
      - Schafer et al., "Experimental Analysis of Attacks on Next Generation Air Traffic Communication", ACNS 2013

  - id: GT-010
    title: Integrity indicators drop to zero
    severity: low
    scope: track
    rationale: >-
      NIC or NACp falling from a healthy value to 0 while the track stays smooth is consistent
      with GNSS interference or spoofing affecting the aircraft's navigation source. Supporting
      indicator only.
    inputs: [nic, nac_p, lat, lon, seen_pos_s]
    thresholds:
      healthy_min: 5
      confidence: 0.3
    false_positive_notes: >-
      Only a drop from >= 5 to 0 between consecutive reports counts. "Smooth" means the jump
      check (GT-004) passes across the drop. Missing NIC/NACp is "not evaluated".
    benign_causes:
      - GNSS interference (jamming tests, NOTAMed GPS testing), which is real but not spoofing of ADS-B.
      - Avionics switching navigation source, or loss of satellite geometry.
    references:
      - readsb README-json.md (nic, nac_p)
      - FAA AC 20-165B (NIC/NACp meaning)
