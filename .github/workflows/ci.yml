name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      - name: Demo fixture is current
        working-directory: backend
        run: python scripts/build_demo.py --check

  frontend:
    # Placeholder until the frontend scaffold lands in a later task. A job-level hashFiles()
    # condition is invalid, so each step after checkout carries the condition instead.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: hashFiles('package.json') != ''
        run: npm ci
      - if: hashFiles('package.json') != ''
        run: npm test
      - if: hashFiles('package.json') != ''
        run: npm run build
      - if: hashFiles('package.json') != ''
        run: npm audit --audit-level=high

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action v2 lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
